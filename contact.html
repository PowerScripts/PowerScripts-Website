<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerScripts - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">⚡ <span>PowerScripts</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="scripts.html">Scripts</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="https://buymeacoffee.com/emileg" target="_blank" class="bmac-btn">☕ Buy Me a Coffee</a>
    </nav>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Get in Touch</h1>
      <p>Have a script idea, found a bug, or want to give feedback? Send us a message!</p>
    </div>

    <div class="card form-card">
      <form id="contact-form" class="contact-form" action="https://formspree.io/f/xgawqwpj" method="POST">
        <div class="form-group">
          <label for="name">Name / Username</label>
          <input type="text" id="name" name="name" placeholder="e.g. Player1" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Type your message or script suggestion..." required></textarea>
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">Send Message</button>
        <p id="form-status"></p>
      </form>
    </div>
  </div>

  <footer>
    <p>Copyright &copy; 2026 PowerScripts is a project by Émile Gagnon</p>
  </footer>

  <script>
    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const data = new FormData(form);
      
      status.style.color = 'var(--text-muted)';
      status.innerText = 'Sending message...';

      fetch(form.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      }).then(response => {
        if (response.ok) {
          status.style.color = '#81c784';
          status.innerText = '✅ Message sent successfully!';
          form.reset();
        } else {
          status.style.color = '#ff6b6b';
          status.innerText = '❌ Failed to send message. Please try again.';
        }
      }).catch(error => {
        status.style.color = '#ff6b6b';
        status.innerText = '❌ An error occurred. Please try again.';
      });
    });
  </script>

</body>
</html>
